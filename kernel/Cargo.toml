[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader_api = "0.11.17"
spin = "0.9"
x86_64 = { version = "0.15", features = ["instructions", "abi_x86_interrupt"] }
pic8259 = "0.11"
linked_list_allocator = "0.10"
noto-sans-mono-bitmap = "0.3"

[features]
headless_test = []

[workspace]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# Debug info даже в release: build.rs собирает kernel именно в release,
# поэтому без этой строки GDB не увидит символов.
debug = true