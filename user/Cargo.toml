[package]
name = "user"
version = "0.1.0"
edition = "2021"

[lib]
name = "userlib"
path = "src/lib.rs"

[[bin]]
name = "user"
path = "src/main.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[[bin]]
name = "calculator"
path = "src/bin/calculator.rs"

[[bin]]
name = "shell"
path = "src/bin/shell.rs"

[[bin]]
name = "echo"
path = "src/bin/echo.rs"

[[bin]]
name = "ls"
path = "src/bin/ls.rs"

[[bin]]
name = "cat"
path = "src/bin/cat.rs"

[[bin]]
name = "ps"
path = "src/bin/ps.rs"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true

[workspace]