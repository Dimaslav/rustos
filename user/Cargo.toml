path = "src/bin/cat.rs"

[[bin]]
name = "ps"
path = "src/bin/ps.rs"

[[bin]]
name = "cp"
path = "src/bin/cp.rs"

[[bin]]
name = "wc"
path = "src/bin/wc.rs"

[[bin]]
name = "head"
path = "src/bin/head.rs"

[[bin]]
name = "dmesg"
path = "src/bin/dmesg.rs"

[[bin]]
name = "kill"
path = "src/bin/kill.rs"

[[bin]]
name = "uname"
path = "src/bin/uname.rs"

[[bin]]
name = "which"
path = "src/bin/which.rs"

[[bin]]
name = "env"
path = "src/bin/env.rs"

[[bin]]
